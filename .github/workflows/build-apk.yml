name: Build APK Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Runner ubuntu-latest sudah menyertakan Android SDK (ANDROID_HOME)
      - name: Cek Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - name: Pasang dependensi
        run: npm ci

      - name: Cek kode web
        run: npm run check

      - name: Salin aset web ke proyek Android
        run: npm run sync

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BelajarBersamaZayn.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BelajarBersamaZayn.apk
          path: BelajarBersamaZayn.apk

      - name: Rilis (hanya untuk tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BelajarBersamaZayn.apk
